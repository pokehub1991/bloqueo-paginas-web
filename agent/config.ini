; ==============================================================
; CONFIGURACIÓN DEL AGENTE CLIENTE WINDOWS - BLOQUEADOR WEB
; ==============================================================
; Configura aquí la dirección IP y puerto de la computadora central
; donde se está ejecutando el Servidor / Dashboard.
;
; Ejemplo si tu servidor está en la misma red:
; ServerUrl = http://192.168.1.150:4000
;
; Para pruebas en la misma computadora:
; ServerUrl = http://localhost:4000
; ==============================================================

[Servidor]
; Dirección URL del panel central (debe incluir http:// y el puerto)
ServerUrl = http://localhost:4000

; Tiempo de espera entre cada consulta de reglas (en segundos)
; 1 segundo para aplicar cambios inmediatamente sin demoras
IntervaloSegundos = 1

; Tiempo límite para esperar respuesta del servidor (en segundos)
TiempoEsperaSegundos = 5

[Navegadores]
; Navegadores en los que se aplicará la restricción (1 = Activado, 0 = Desactivado)
BloquearChrome = 1
BloquearEdge = 1
BloquearFirefox = 1
BloquearOpera = 1
